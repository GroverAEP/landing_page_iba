<div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="false"></div>

<template id="toastTemplate">
  <div class="toast" role="status">
    <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
    <p class="toast-message flex-1"></p>
    <button type="button" class="toast-close text-[color:#8B9186] hover:text-white flex-shrink-0" aria-label="Cerrar notificación">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
</template>
