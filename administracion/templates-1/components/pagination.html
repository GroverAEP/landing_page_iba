<div class="flex flex-col sm:flex-row items-center justify-between gap-4 px-1 py-1" id="paginationBar">

  <div class="flex items-center gap-2 text-sm text-[color:var(--color-slate)]">
    <span>Mostrar</span>
    <select class="field-select !w-auto !py-1.5 !pr-8" id="pageSizeSelect" aria-label="Resultados por página">
      <option value="10">10</option>
      <option value="25" selected>25</option>
      <option value="50">50</option>
      <option value="100">100</option>
    </select>
    <span id="paginationRangeLabel">1–25 de 128</span>
  </div>

  <nav class="flex items-center gap-1" aria-label="Paginación">
    <button type="button" class="btn-icon" id="paginationPrevBtn" aria-label="Página anterior">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="flex items-center gap-1" id="paginationNumbers">
      <!-- page number buttons injected by pagination.js -->
    </div>
    <button type="button" class="btn-icon" id="paginationNextBtn" aria-label="Página siguiente">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </nav>

</div>
